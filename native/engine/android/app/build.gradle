import org.apache.tools.ant.taskdefs.condition.Os

apply plugin: 'com.android.application'

RES_PATH = RES_PATH.replace("\\", "/")
COCOS_ENGINE_PATH = COCOS_ENGINE_PATH.replace("\\", "/")

buildDir = "${RES_PATH}/proj/build/${project.name ==~ /^[_a-zA-Z0-9-]+$/ ? project.name : 'CocosGame'}"
android {
    buildFeatures { buildConfig true }
    compileSdkVersion PROP_COMPILE_SDK_VERSION.toInteger()
    buildToolsVersion PROP_BUILD_TOOLS_VERSION
    ndkVersion PROP_NDK_VERSION
    namespace APPLICATION_ID

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId APPLICATION_ID
        minSdkVersion PROP_MIN_SDK_VERSION
        targetSdkVersion PROP_TARGET_SDK_VERSION
        versionCode 3
        versionName "1.0.2"

        externalNativeBuild {
            cmake {
                targets "cocos"
                arguments "-DRES_DIR=${RES_PATH}", "-DANDROID_STL=c++_static", "-DANDROID_TOOLCHAIN=clang", "-DANDROID_ARM_NEON=TRUE"
            }
            ndk { abiFilters PROP_APP_ABI.split(':') }
        }
    }

    flavorDimensions 'channel'
    productFlavors {
        taptap {
            dimension 'channel'
            def tapClientId = project.findProperty('TAPTAP_CLIENT_ID') ?: System.getenv('TAPTAP_CLIENT_ID') ?: ''
            def tapClientToken = project.findProperty('TAPTAP_CLIENT_TOKEN') ?: System.getenv('TAPTAP_CLIENT_TOKEN') ?: ''
            buildConfigField 'String', 'TAPTAP_CLIENT_ID', '"' + tapClientId + '"'
            buildConfigField 'String', 'TAPTAP_CLIENT_TOKEN', '"' + tapClientToken + '"'
        }
        generic {
            dimension 'channel'
        }
    }

    sourceSets.main {
        // Do not include all of src: flavor-specific ChannelGate files must stay isolated.
        java.srcDirs "../src", "src/com"
        res.srcDirs "../res", 'res', "${RES_PATH}/proj/res"
        jniLibs.srcDirs "../libs", 'libs'
        manifest.srcFile "AndroidManifest.xml"
        assets.srcDir "${RES_PATH}/data"
        jniLibs {
            // Vulkan validation layer
            // srcDir "${android.ndkDirectory}/sources/third_party/vulkan/src/build-android/jniLibs"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging Boolean.parseBoolean(PROP_ENABLE_COMPRESS_SO)
        }
    }

    externalNativeBuild {
        cmake {
            version "3.24.3"
            path "../CMakeLists.txt"
            buildStagingDirectory "${RES_PATH}/proj/build"
        }
    }

    signingConfigs {

       release {
            def storePath = System.getenv('GAME_RELEASE_STORE_FILE') ?: System.getenv('TAPTAP_RELEASE_STORE_FILE') ?: project.findProperty('RELEASE_STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('GAME_RELEASE_STORE_PASSWORD') ?: System.getenv('TAPTAP_RELEASE_STORE_PASSWORD') ?: RELEASE_STORE_PASSWORD
                keyAlias System.getenv('GAME_RELEASE_KEY_ALIAS') ?: System.getenv('TAPTAP_RELEASE_KEY_ALIAS') ?: RELEASE_KEY_ALIAS
                keyPassword System.getenv('GAME_RELEASE_KEY_PASSWORD') ?: System.getenv('TAPTAP_RELEASE_KEY_PASSWORD') ?: RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv('GAME_RELEASE_STORE_FILE') || System.getenv('TAPTAP_RELEASE_STORE_FILE') || project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
                        
            externalNativeBuild {
                cmake {
                    // switch HIDE_SYMBOLS to OFF to skip compilation flag `-fvisibility=hidden`
                    arguments "-DHIDE_SYMBOLS=ON"
                }
            }

            if (!Boolean.parseBoolean(PROP_IS_DEBUG)) {
                getIsDefault().set(true)
            }

        }

        debug {
            debuggable true
            jniDebuggable true
            renderscriptDebuggable true
            // resValue  "string", "app_name", "${PROP_APP_NAME}-dbg"
            // applicationIdSuffix ".debug"
        }
    }
}

dependencies {
    taptapImplementation 'com.taptap.sdk:tap-core:4.10.9'
    taptapImplementation 'com.taptap.sdk:tap-login:4.10.9'
    taptapImplementation 'com.taptap.sdk:tap-compliance:4.10.9'
    taptapImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    implementation fileTree(dir: '../libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation fileTree(dir: "${COCOS_ENGINE_PATH}/cocos/platform/android/java/libs", include: ['*.jar'])
    implementation project(':libservice')
    implementation project(':libcocos')
    if (Boolean.parseBoolean(PROP_ENABLE_INPUTSDK)) {
        implementation 'com.google.android.libraries.play.games:inputmapping:1.1.0-beta'
        implementation "org.jetbrains.kotlin:kotlin-stdlib:1.4.10"
    }
}
