apply plugin: 'com.android.application'

android {
    namespace 'com.xyzhi.nextstopgoodnight.preview'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xyzhi.nextstopgoodnight.preview'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0-preview'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
